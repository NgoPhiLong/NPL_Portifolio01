<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ngô Phi Long — Portfolio</title>
    <base href="/" />

    <meta name="description" content="Portfolio of Ngô Phi Long — software engineer building fast, reliable web applications with .NET and Blazor." />
    <meta name="author" content="Ngô Phi Long" />
    <meta name="theme-color" content="#070a13" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ngô Phi Long — Portfolio" />
    <meta property="og:description" content="Software engineer building fast, reliable web applications with .NET and Blazor." />
    <meta property="og:image" content="https://github.com/NgoPhiLong.png?size=460" />
    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved theme & language before anything is painted (avoids a flash of the wrong theme). -->
    <script>
        (function () {
            var root = document.documentElement, theme = null, lang = null;
            try { theme = localStorage.getItem('npl-theme'); lang = localStorage.getItem('npl-lang'); } catch (e) { }
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            if (lang !== 'en' && lang !== 'vi') {
                lang = /^vi\b/i.test(navigator.language || '') ? 'vi' : 'en';
            }
            root.setAttribute('data-theme', theme);
            root.style.colorScheme = theme;
            root.lang = lang;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) { meta.setAttribute('content', theme === 'light' ? '#f6f7fb' : '#070a13'); }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-loader" role="status">
            <div class="loader-ring">
                <span class="loader-initials">NPL</span>
            </div>
            <p class="loader-text">
                <span class="i18n-en">Loading portfolio</span><span class="i18n-vi">Đang tải portfolio</span>
            </p>
        </div>
    </div>

    <noscript>
        <div class="noscript">
            This site needs JavaScript to run. · Trang web này cần bật JavaScript để hoạt động.
        </div>
    </noscript>

    <div id="blazor-error-ui" role="alert">
        <span class="i18n-en">An unexpected error has occurred.</span>
        <span class="i18n-vi">Đã xảy ra lỗi không mong muốn.</span>
        <a href="." class="reload"><span class="i18n-en">Reload</span><span class="i18n-vi">Tải lại</span></a>
        <button type="button" class="dismiss" aria-label="Dismiss" onclick="this.parentElement.style.display = 'none'">×</button>
    </div>

    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
