# Builds the Blazor WebAssembly portfolio and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish NPL_Portifolio01/NPL_Portifolio01.csproj -c Release -o release --nologo

      - name: Prepare site for GitHub Pages
        shell: bash
        run: |
          site=release/wwwroot
          repo="${GITHUB_REPOSITORY#*/}"

          # Project sites live under /<repo>/; user sites (<user>.github.io) and custom domains live under /.
          if [[ "$repo" == *.github.io || -f "$site/CNAME" ]]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "Base path: $base"

          sed -i -E "s#<base href=\"[^\"]*\" ?/?>#<base href=\"$base\" />#" "$site/index.html"
          grep -q "<base href=\"$base\" />" "$site/index.html"

          # Unknown paths load the app, which then shows its own 404 page.
          cp "$site/index.html" "$site/404.html"
          # Serve folders starting with "_" (such as _framework) as-is.
          touch "$site/.nojekyll"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
